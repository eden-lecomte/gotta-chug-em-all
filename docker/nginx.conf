server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Unraid usually sits behind its own reverse proxy, so trust the forwarded
    # scheme rather than nginx's own idea of it.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml font/ttf;
    # WebP, OGG and MP3 are already compressed; gzip would only burn CPU.

    # `expires` emits a Cache-Control of its own, so max-age is set by hand here
    # to avoid sending the header twice.

    # Vite fingerprints everything under assets/, so those URLs are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Art, audio and fonts keep stable names, so they need revalidation rather
    # than an immutable promise — a replaced sprite must not be cached forever.
    location ~* \.(webp|png|gif|ico|ogg|mp3|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # No routing in the app yet, but a stale index.html would pin a browser to a
    # deleted bundle, so it is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
